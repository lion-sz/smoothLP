[project]
name = "smoothlp"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.8.0",
    "numpy>=2.3.4",
    "scipy>=1.16.2",
    "statsmodels>=0.14.5",
]

[project.optional-dependencies]
examples = [
    "marimo>=0.17.0",
    "matplotlib>=3.10.7",
    "polars>=1.34.0",
]
cuda = [
    "jax[cuda]>=0.8.0",
]
simulator = [
    "simulator",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "line-profiler>=5.0.0",
    "pytest>=8.4.2",
]

[tool.uv.workspace]
members = [
    "simulator",
]
[tool.uv.sources]
simulator = {workspace = true}
