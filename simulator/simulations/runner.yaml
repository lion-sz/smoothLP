runner:
  n_runs: 1000
  key: 12

  n: 2000
  h: 90

  data:
    - white_noise:
        GaussianNoise:
          sigma: 0.2
    - AR1:
        AR1:
          rho: 0.75
          sc:
            GaussianNoise:
              sigma: 0.1
  irf:
    - ZeroIRF:
        ZeroIRF:
    - SinIRF:
        SinIRF:
  shock:
    - Sparse45:
        SparseShock:
          freq: 45
          sc:
            GaussianShock:
              mu: 0.0
              sigma: 1.0
    - Sparse20:
        SparseShock:
          freq: 20
          sc:
            GaussianShock:
              mu: 0.0
              sigma: 1.0
    - Normal:
        GaussianShock:
          mu: 0.0
          sigma: 1.0
  combination: linear_combination
  fixed_kwargs:
    smooth_window: 30
  model_kwargs:
    - slp_90lags:
        smooth_data: false
        smooth_mod: true
        vcov: HAC
        lags: 90
